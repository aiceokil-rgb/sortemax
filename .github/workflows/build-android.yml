name: Build Android (Play)

# 서명하지 않은 AAB 를 만든다. 서명은 비공개 키로 따로 한다(키는 저장소에 넣지 않음).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build AAB
        working-directory: android
        run: gradle --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sortemax-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
      - name: Publicar AAB sem assinatura no ramo android-build
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/app-release-unsigned.aab
          git config user.name "sortemax-bot"
          git config user.email "contato@duriup.com.br"
          git checkout --orphan android-build
          git rm -rf --quiet .
          cp /tmp/app-release-unsigned.aab app-release-unsigned.aab
          echo "${GITHUB_SHA}" > source-commit.txt
          git add app-release-unsigned.aab source-commit.txt
          git commit -m "AAB sem assinatura de ${GITHUB_SHA::7}"
          git push -f origin android-build
